name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows
        shell: bash
        run: |
          set +e
          npx electron-builder --win 2>&1 | tee build-win.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "### electron-builder Windows failed (exit $status)" >> "$GITHUB_STEP_SUMMARY"
            tail -80 build-win.log >> "$GITHUB_STEP_SUMMARY"
            exit $status
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Agent-Windows
          path: dist/*.exe
          if-no-files-found: error

  build-mac:
    name: macOS (arm64 + x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build macOS
        shell: bash
        run: |
          set +e
          npx electron-builder --mac --x64 --arm64 2>&1 | tee build-mac.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "### electron-builder macOS failed (exit $status)" >> "$GITHUB_STEP_SUMMARY"
            tail -80 build-mac.log >> "$GITHUB_STEP_SUMMARY"
            exit $status
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Agent-macOS
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**